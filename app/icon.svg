<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Accretion disk radial gradient -->
    <radialGradient id="accretionGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="1" />
      <stop offset="25%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="55%" stop-color="#2563eb" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    
    <!-- Thin event horizon glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="transparent" />

  <!-- Accretion Disk (Background glow) -->
  <ellipse cx="50" cy="50" rx="46" ry="18" fill="url(#accretionGlow)" transform="rotate(-15 50 50)" />
  
  <!-- Relativistic Beaming (Bright light sweep across the event horizon) -->
  <path d="M 12 44 C 28 33, 72 33, 88 44 C 82 58, 18 58, 12 44 Z" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.85" transform="rotate(-15 50 50)" />
  
  <!-- Shadow/Event Horizon -->
  <circle cx="50" cy="50" r="14" fill="#000000" stroke="#c084fc" stroke-width="1.5" filter="url(#glow)" />
</svg>
